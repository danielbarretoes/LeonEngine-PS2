; Game/ShooterGame/SourceArt/ImportList.ini - the source files of ShooterGame's imported assets (UE keeps source art
; outside Content). Import them all (from the repo root):
;   Engine\Binaries\Win64\LeonCook.exe Game\ShooterGame\ShooterGame.lproj -run=ImportAssets -importlist=Game/ShooterGame/SourceArt/ImportList.ini
; and bring them back from their sources, which must leave Game/ShooterGame/Content unchanged (gate G5):
;   Engine\Build\BatchFiles\CheckReimport.bat Game\ShooterGame\ShooterGame.lproj
;
; One section per asset: Source (relative to this file), Dest (the long package path of its folder; a map's own
; package), optional Name and Type (Docs/TOOLS.md, "ImportList.ini"). The map's and the bodies' .glb files are written by
; the Blender scripts next to them (Maps/make_de_leon.py, Characters/make_team_bodies.py), which also save the .blend
; sources; the weapons' .glb files and the .wav sounds by the Python scripts Weapons/make_weapons.py and
; Sounds/make_sounds.py (the standard library only, no Blender).

; The de_leon blockout: the map, its meshes in /Game/Maps/de_leon/Meshes and its materials in
; /Game/Maps/de_leon/Materials. DefaultEditor.ini's rules make its bomb sites and buy zones and check its tags.
[de_leon]
Source=Maps/de_leon.glb
Dest=/Game/Maps/de_leon
Type=Map

; The teams' bodies (AShooterCharacter), loaded by path: DefaultGame.ini cooks
; /Game/Characters whole.
[SM_Body_CT]
Source=Characters/Body_CT.glb
Dest=/Game/Characters
Type=StaticMesh

[SM_Body_T]
Source=Characters/Body_T.glb
Dest=/Game/Characters
Type=StaticMesh

; The weapons (AShooterWeapon's MeshName in DefaultGame.ini), each with its Muzzle socket, and their shared materials
; (M_WeaponMetal, M_WeaponWood, ...); DefaultGame.ini cooks /Game/Weapons whole.
[SM_Grenade]
Source=Weapons/Grenade.glb
Dest=/Game/Weapons
Type=StaticMesh

[SM_Pistol]
Source=Weapons/Pistol.glb
Dest=/Game/Weapons
Type=StaticMesh

[SM_Rifle]
Source=Weapons/Rifle.glb
Dest=/Game/Weapons
Type=StaticMesh

[SM_Sniper]
Source=Weapons/Sniper.glb
Dest=/Game/Weapons
Type=StaticMesh

; The weapons' sounds (DefaultGame.ini: FireSoundName, ReloadSoundName, ...); DefaultGame.ini cooks /Game/Sounds whole.
[S_Empty]
Source=Sounds/Empty.wav
Dest=/Game/Sounds

[S_Equip]
Source=Sounds/Equip.wav
Dest=/Game/Sounds

[S_Explosion]
Source=Sounds/Explosion.wav
Dest=/Game/Sounds

[S_Pistol_Fire]
Source=Sounds/Pistol_Fire.wav
Dest=/Game/Sounds

[S_Reload]
Source=Sounds/Reload.wav
Dest=/Game/Sounds

[S_Rifle_Fire]
Source=Sounds/Rifle_Fire.wav
Dest=/Game/Sounds

[S_Sniper_Fire]
Source=Sounds/Sniper_Fire.wav
Dest=/Game/Sounds

[S_Throw]
Source=Sounds/Throw.wav
Dest=/Game/Sounds
