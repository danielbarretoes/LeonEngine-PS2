Dest=/Game/Characters
Type=SkeletalMesh
NewSkeletonName=SKEL_Body

[SK_Body_T]
Source=Characters/Body_T.glb
Dest=/Game/Characters
Type=SkeletalMesh
Skeleton=/Game/Characters/SKEL_Body.SKEL_Body

