Dest=/Game/Characters/Animations
Type=Animation
Skeleton=/Game/Characters/SKEL_Body.SKEL_Body

; The locomotion by speed (cm/s: CS's walk 330, a rifle's run 560) and direction (degrees from the facing, right
; positive), standing and crouched (CS's crouch: a third of the run).
[BS_Locomotion]
Type=BlendSpace
Dest=/Game/Characters/Animations
AxisX=Speed,0,600
AxisY=Direction,-180,180
+Sample=A_Idle,0,-180
+Sample=A_Idle,0,-90
+Sample=A_Idle,0,0
+Sample=A_Idle,0,90
+Sample=A_Idle,0,180
+Sample=A_Walk_B,330,-180
+Sample=A_Walk_L,330,-90
+Sample=A_Walk_F,330,0
+Sample=A_Walk_R,330,90
+Sample=A_Walk_B,330,180
+Sample=A_Run_B,560,-180
+Sample=A_Run_L,560,-90
+Sample=A_Run_F,560,0
+Sample=A_Run_R,560,90
+Sample=A_Run_B,560,180

[BS_Crouch]
Type=BlendSpace
Dest=/Game/Characters/Animations
AxisX=Speed,0,220
AxisY=Direction,-180,180
+Sample=A_Crouch_Idle,0,-180
+Sample=A_Crouch_Idle,0,-90
+Sample=A_Crouch_Idle,0,0
+Sample=A_Crouch_Idle,0,90
+Sample=A_Crouch_Idle,0,180
+Sample=A_Crouch_Walk_B,200,-180
+Sample=A_Crouch_Walk_L,200,-90
+Sample=A_Crouch_Walk_F,200,0
+Sample=A_Crouch_Walk_R,200,90
+Sample=A_Crouch_Walk_B,200,180

; The weapons' stances (AShooterWeapon::AimOffsetName): the upper body aiming from -90 to 90 degrees, each measured
; from the rifle's straight-ahead pose that the locomotion holds, so a pistol's or a grenade's aim offset also turns
; the rifle's arms into its own stance.
[AO_Rifle]
Type=AimOffsetBlendSpace1D
Dest=/Game/Characters/Animations
+Sample=A_Aim_Rifle_Down90,-90
+Sample=A_Aim_Rifle_Down45,-45
+Sample=A_Aim_Rifle_Center,0
+Sample=A_Aim_Rifle_Up45,45
+Sample=A_Aim_Rifle_Up90,90
