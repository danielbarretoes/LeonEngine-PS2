; Game/ShooterGame/SourceArt/ImportList.ini - the source files of ShooterGame's imported assets (UE keeps source art
; outside Content). Import them all (from the repo root):
;   Engine\Binaries\Win64\LeonCook.exe Game\ShooterGame\ShooterGame.lproj -run=ImportAssets -importlist=Game/ShooterGame/SourceArt/ImportList.ini
; and bring them back from their sources, which must leave Game/ShooterGame/Content unchanged (gate G5):
;   Engine\Build\BatchFiles\CheckReimport.bat Game\ShooterGame\ShooterGame.lproj
;
; One section per asset: Source (relative to this file), Dest (the long package path of its folder; a map's own
; package), optional Name and Type (Docs/TOOLS.md, "ImportList.ini"); the blend spaces, aim offsets and montages have
; no Source (they are made from the clips of the sections before them). The .glb files are written by the Blender
; scripts next to them (Maps/make_de_leon.py, Maps/make_de_harbor.py, Characters/make_characters.py,
; Characters/make_cs16_characters.py, Characters/make_arms.py, Weapons/make_weapons.py; Docs/ART_PIPELINE.md), the .wav sounds by the Python script Sounds/make_sounds.py (the
; standard library only, no Blender), MainMenu.glb by Maps/make_main_menu.py (the same).

; The physical materials (ps2-shipping N30f; UE's PM_): what the surfaces are made of, CS's texture types. The surface
; types are named in DefaultEngine.ini ([/Script/Engine.PhysicsSettings]); the glTF materials name their physical
; material in their extras (leon_art.make_material's phys_material, Docs/ART_PIPELINE.md), so these come before the
; meshes and the map that use them:
;   PM_Concrete  de_leon's sandstone walls and houses, their trim, the site signs; de_harbor's asphalt, concrete and
;                boundary walls
;   PM_Dirt      de_leon's sand of the T side, mid and the longs; de_harbor's water
;   PM_Metal     de_leon's tunnel lamps; de_harbor's corrugated sheds, containers, crane, ladder and lamps; the weapons
;   PM_Wood      de_leon's crates, mid doors' wings, ladders and tunnel ceiling; de_harbor's pallet crates
;   PM_Tile      de_leon's paving of the CT spawn and the sites
;   PM_Glass     none in the maps yet
;   PM_Computer  the C4
;   PM_Flesh     the characters and their arms
[PM_Concrete]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Concrete

[PM_Dirt]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Dirt

[PM_Metal]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Metal

[PM_Wood]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Wood

[PM_Tile]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Tile

[PM_Glass]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Glass

[PM_Computer]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Computer

[PM_Flesh]
Type=PhysicalMaterial
Dest=/Game/PhysicalMaterials
SurfaceType=Flesh

; The skies (Sky/make_sky.py writes the long-lat HDRs, Docs/ART_PIPELINE.md): cube maps of six 128-texel faces,
; tone-mapped by the ACES curve at the scene's exposure (UTextureCubeFactory). The maps' world settings name them, so
; they come first: the desert for de_leon, the coast for de_harbor.
[T_Sky_Desert]
Source=Sky/Sky_Desert.hdr
Dest=/Game/Sky
Type=TextureCube
CubeFaceSize=128
ExposureBias=0

[T_Sky_Coast]
Source=Sky/Sky_Coast.hdr
Dest=/Game/Sky
Type=TextureCube
CubeFaceSize=128
ExposureBias=0

; de_leon (Maps/make_de_leon.py): the map, its meshes in /Game/Maps/de_leon/Meshes and its materials and painted
; textures in /Game/Maps/de_leon/Materials. DefaultEditor.ini's rules make its bomb sites and buy zones and check its tags.
[de_leon]
Source=Maps/de_leon.glb
Dest=/Game/Maps/de_leon
Type=Map

; de_harbor (Maps/make_de_harbor.py): the second map, an industrial port, its meshes in /Game/Maps/de_harbor/Meshes and
; its materials and painted textures in /Game/Maps/de_harbor/Materials (none shared with de_leon), by the same rules.
[de_harbor]
Source=Maps/de_harbor.glb
Dest=/Game/Maps/de_harbor
Type=Map

; The main menu's backdrop (Maps/make_main_menu.py, standard-library Python; ps2-polish P9): the GameDefaultMap, its
; meshes in /Game/Maps/MainMenu/Meshes and its plain-coloured materials in /Game/Maps/MainMenu/Materials. It is not
; played on, so DefaultEditor.ini exempts it from the required tags.
[MainMenu]
Source=Maps/MainMenu.glb
Dest=/Game/Maps/MainMenu
Type=Map

; The characters (Characters/make_cs16_characters.py, Docs/ART_PIPELINE.md): the teams' bodies, Counter-Strike 1.6's
; SAS and Leet Krew, on the shared skeleton SKEL_Body, which the first body makes, their materials and textures;
