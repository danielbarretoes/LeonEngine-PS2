; DefaultEditor.ini - ShooterGame's editor settings (UE: <Project>/Config/DefaultEditor.ini), over
; Engine/Config/BaseEditor.ini. Read by LeonCook's commandlets only: the cook never stages it.

[/Script/LeonEd.MapImportSettings]
; The game's map nodes (plan decision D15: the engine makes engine classes, the game's meaning is tags). A node whose
; name starts with the prefix becomes a trigger volume (the box of its mesh) with the rule's tag and the rest of its
; name as a second tag: BombSite_A -> [BombSite, A], BuyZone_CT -> [BuyZone, CT] (Blender's .001 copies are fine).
+NodeRules=(Prefix="BombSite",ActorClass=/Script/Engine.TriggerVolume,Tags=("BombSite"),bSuffixAsTag=True)
+NodeRules=(Prefix="BuyZone",ActorClass=/Script/Engine.TriggerVolume,Tags=("BuyZone"),bSuffixAsTag=True)
; What every ShooterGame map must hold, or its import fails: two bomb sites, and the team starts and buy zones
; (PlayerStart_CT / PlayerStart_T nodes: the engine's PlayerStart rule makes the suffix the PlayerStartTag)
+RequiredTags=TriggerVolume:BombSite+A
+RequiredTags=TriggerVolume:BombSite+B
+RequiredTags=TriggerVolume:BuyZone+CT
+RequiredTags=TriggerVolume:BuyZone+T
+RequiredTags=PlayerStart:CT
+RequiredTags=PlayerStart:T
; P20: the import links the waypoints a player can walk between (a capsule sweep with CS's hull, a 45 cm step, a jump
; onto a 1.1 m crate, a 3 m drop), besides the links the nodes name, up to 20 m apart; the links are saved in the map
bAutoLinkWaypoints=True
WaypointAgentRadius=40.0
WaypointAgentHalfHeight=91.5
WaypointMaxStepHeight=45.0
WaypointMaxJumpHeight=115.0
WaypointMaxDropHeight=300.0
WaypointMaxLinkDistance=2000.0
