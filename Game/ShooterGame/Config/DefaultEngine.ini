; DefaultEngine.ini - ShooterGame's engine settings (UE: <Project>/Config/DefaultEngine.ini), over
; Engine/Config/BaseEngine.ini.

[/Script/EngineSettings.GameMapsSettings]
; The map the game opens (plan decision D18): the de_leon blockout, imported from SourceArt/Maps/de_leon.glb
GameDefaultMap=/Game/Maps/de_leon
; Every map's game mode unless ?game= or the map's world settings name another
GlobalDefaultGameMode=/Script/ShooterGame.ShooterGameMode

[/Script/Engine.CollisionProfile]
; The game's collision channels (UCollisionProfile). Weapon: the channel P18's hitscan weapons trace on; everything
; blocks it by default, the characters' capsules included (UE ShooterGame: COLLISION_WEAPON = ECC_GameTraceChannel1)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")

[/Script/Engine.NavigationSystem]
; The bots' agent, for the waypoint graph and the map import's auto-linking (FWaypointLinkParams::FromConfig): CS's
; standing hull (40 cm radius, 183 cm), a 45 cm step, a jump onto a 1.1 m crate (the character's jump rises 114 cm:
; UShooterCharacterMovement's JumpZVelocity and gravity), a 3 m drop, links up to 20 m long
AgentRadius=40.0
AgentHeight=183.0
AgentMaxStepHeight=45.0
AgentMaxJumpHeight=112.0
AgentMaxDropHeight=300.0
MaxLinkDistance=2000.0
