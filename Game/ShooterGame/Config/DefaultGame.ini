; DefaultGame.ini - ShooterGame's game settings (UE: <Project>/Config/DefaultGame.ini), over
; Engine/Config/BaseGame.ini.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=ShooterGame
Description=Offline Counter-Strike-style shooter: two teams on de_leon, first-person movement, bots (Win64 first)
ProjectVersion=0.1.0

[/Script/UnrealEd.ProjectPackagingSettings]
; What the cook takes besides the maps under /Game/Maps (de_leon) and what they reference: the team bodies are loaded by
; path (the character's config below), so no package references them (Docs/TOOLS.md, "The cook").
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; The weapons' meshes and sounds, loaded by path from the weapons' sections below
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Sounds")

[/Script/ShooterGame.ShooterGameMode]
; Players a team takes (CS: 5 a side); bot_add refuses more
MaxPlayersPerTeam=5
; Teammates do not hurt each other (CS: mp_friendlyfire 0)
bFriendlyFire=False
; Bots fill both teams to five a side as soon as a human is in (CS: bot_quota 10, fill)
bFillTeamsWithBots=True
; The round: 6 s of freeze (buying), 1:55 to play, 5 s to show the result; 45 s to buy (CS: mp_freezetime,
; mp_roundtime, mp_buytime); 30 rounds, the first team to 16 wins (mp_maxrounds)
FreezeTime=6.0
RoundTime=115.0
RoundRestartDelay=5.0
BuyTime=45.0
MaxRounds=30
; Money (CS 1.6): 800 to start, 16000 at most; 3250 a won round (3500 by the bomb or a defuse); the loss bonus 1400,
; +500 a consecutive loss up to 3400, +800 for terrorists who lose after planting; 300 to the planter and the
; defuser; a team kill costs 3300
StartMoney=800
MaxMoney=16000
WinReward=3250
BombWinReward=3500
LossBonusBase=1400
LossBonusIncrement=500
LossBonusMax=3400
LosingTeamPlantBonus=800
PlantReward=300
DefuseReward=300
TeamKillPenalty=3300
; The equipment's prices (CS 1.6); the weapons' are in their sections (Price)
VestPrice=650
VestHelmetPrice=1000
HelmetPrice=350
DefuserPrice=200
; The seed of the round stream (the bomb's carrier); ?seed=N in the URL overrides it
RandomSeed=1

[/Script/ShooterGame.ShooterBomb]
; The C4: 40 s from the plant, 3 s to plant, 10 s to defuse (5 with a kit), 500 damage within 17.5 m through walls
BombTimer=40.0
PlantDuration=3.0
DefuseDuration=10.0
DefuseKitDuration=5.0
ExplosionDamage=500.0
ExplosionRadius=1750.0
MeshName=/Game/Weapons/SM_C4.SM_C4
BeepSoundName=/Game/Sounds/S_Bomb_Beep.S_Bomb_Beep
PlantSoundName=/Game/Sounds/S_Bomb_Plant.S_Bomb_Plant
DefuseSoundName=/Game/Sounds/S_Bomb_Defuse.S_Bomb_Defuse
ExplodeSoundName=/Game/Sounds/S_Explosion.S_Explosion

[/Script/ShooterGame.ShooterAIController]
; The bots' skill (CS bot_difficulty): 0.5 easy, 1 normal, 2 hard; it scales the reaction and the aim error down
Difficulty=1.0
; Seconds from an enemy coming into sight to the first shot
ReactionTime=0.35
; The aim's error on a new target (degrees), how fast it settles (seconds for 1/e) and its floor
AimError=5.0
AimErrorDecayTime=0.8
MinAimError=0.4
; Turn rate (degrees a second)
AimTurnRate=360.0
; Automatic fire in bursts: shots, then a pause (seconds)
BurstShots=4
BurstPause=0.35
; Seconds an enemy out of sight is remembered
EnemyMemory=1.5
; The chance to buy the AWP when affordable with armor
AwpChance=0.2
; How near a goal counts as reached (cm)
GoalReachedDistance=200.0
; How near the bomb carrier an escorting terrorist stays (cm)
EscortDistance=350.0
; Seconds a CT holds its site without contact before rotating to the next one
RotateTime=25.0
; Living players over the enemy's a team needs to hunt them while no bomb is planted (0: never)
HuntAdvantage=2

[/Script/ShooterGame.ShooterCharacterMovement]
; The walk key's fraction of the running speed (CS: 52 %); the rest of the movement is in ShooterCharacterMovement.h
WalkSpeedModifier=0.52

[/Script/ShooterGame.ShooterCharacter]
; How fast the view follows a crouch (FMath::FInterpTo speed)
EyeHeightInterpSpeed=14.0
; The bodies the other players see (boxes made in Blender; SourceArt/Characters)
CTBodyMeshName=/Game/Characters/SM_Body_CT.SM_Body_CT
TBodyMeshName=/Game/Characters/SM_Body_T.SM_Body_T
; CS: 100 health, up to 100 armor; the head is the capsule's top 28 cm
MaxHealth=100.0
MaxArmor=100.0
HeadHeight=28.0
; Every player spawns with the pistol (CS: the USP for the CT, the Glock for the T; one pistol here)
+DefaultWeapons=usp
; A corpse stays until the round restarts
CorpseLifeSpan=0.0

; The weapons (AShooterWeapon and its classes; the constructors hold CS's values, these sections their looks). The
; meshes and sounds are made by SourceArt/Weapons/make_weapons.py and SourceArt/Sounds/make_sounds.py (CC0).
[/Script/ShooterGame.ShooterWeapon_Pistol]
MeshName=/Game/Weapons/SM_Pistol.SM_Pistol
FireSoundName=/Game/Sounds/S_Pistol_Fire.S_Pistol_Fire
ReloadSoundName=/Game/Sounds/S_Reload.S_Reload
EmptySoundName=/Game/Sounds/S_Empty.S_Empty
EquipSoundName=/Game/Sounds/S_Equip.S_Equip
FirstPersonOffset=(X=36.0,Y=11.0,Z=-15.0)
RandomSeed=11

[/Script/ShooterGame.ShooterWeapon_Rifle]
MeshName=/Game/Weapons/SM_Rifle.SM_Rifle
FireSoundName=/Game/Sounds/S_Rifle_Fire.S_Rifle_Fire
ReloadSoundName=/Game/Sounds/S_Reload.S_Reload
EmptySoundName=/Game/Sounds/S_Empty.S_Empty
EquipSoundName=/Game/Sounds/S_Equip.S_Equip
RandomSeed=47

[/Script/ShooterGame.ShooterWeapon_Sniper]
MeshName=/Game/Weapons/SM_Sniper.SM_Sniper
FireSoundName=/Game/Sounds/S_Sniper_Fire.S_Sniper_Fire
ReloadSoundName=/Game/Sounds/S_Reload.S_Reload
EmptySoundName=/Game/Sounds/S_Empty.S_Empty
EquipSoundName=/Game/Sounds/S_Equip.S_Equip
RandomSeed=83

[/Script/ShooterGame.ShooterWeapon_Grenade]
MeshName=/Game/Weapons/SM_Grenade.SM_Grenade
FireSoundName=/Game/Sounds/S_Throw.S_Throw
EquipSoundName=/Game/Sounds/S_Equip.S_Equip
ExplodeSoundName=/Game/Sounds/S_Explosion.S_Explosion
FirstPersonOffset=(X=24.0,Y=12.0,Z=-16.0)

[/Script/ShooterGame.ShooterHUD]
; CS's default crosshair: green, 4 px gap, 7 px arms, 2 px thick
CrosshairColor=(R=0.0,G=1.0,B=0.0,A=1.0)
CrosshairGap=4.0
CrosshairLength=7.0
CrosshairThickness=2.0
