; DefaultGame.ini - ShooterGame's game settings (UE: <Project>/Config/DefaultGame.ini), over
; Engine/Config/BaseGame.ini.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=ShooterGame
Description=Offline Counter-Strike-style shooter: two teams on de_leon, first-person movement, bots (Win64 first)
ProjectVersion=0.1.0

[/Script/UnrealEd.ProjectPackagingSettings]
; What the cook takes besides the maps under /Game/Maps (de_leon) and what they reference: the characters, their arms
; and their animations are loaded by path (the character's config below), so no package references them (Docs/TOOLS.md,
; "The cook"); the folders are cooked with their subfolders.
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
; The weapons' meshes and sounds, loaded by path from the weapons' sections below (N30's weapons too)
+DirectoriesToAlwaysCook=(Path="/Game/Weapons")
+DirectoriesToAlwaysCook=(Path="/Game/Sounds")

[/Script/ShooterGame.ShooterGameMode]
; Players a team takes (CS: 5 a side); bot_add refuses more
MaxPlayersPerTeam=5
; Teammates do not hurt each other (CS: mp_friendlyfire 0)
bFriendlyFire=False
; Bots fill both teams to five a side as soon as a human is in (CS: bot_quota 10, fill)
bFillTeamsWithBots=True
; The round: 6 s of freeze (buying), 1:55 to play, 5 s to show the result; 45 s to buy (CS: mp_freezetime,
; mp_roundtime, mp_buytime); 30 rounds, the first team to 16 wins (mp_maxrounds)
FreezeTime=6.0
RoundTime=115.0
RoundRestartDelay=5.0
BuyTime=45.0
MaxRounds=30
; The teams switch sides after half of the rounds (15), keeping their scores; the money starts over (CS:GO's
; mp_halftime, the competitive halves of CS 1.6)
bHalftime=True
; Money (CS 1.6): 800 to start, 16000 at most; 3250 a won round (3500 by the bomb or a defuse); the loss bonus 1400,
; +500 a consecutive loss up to 3400, +800 for terrorists who lose after planting; 300 to the planter and the
; defuser; a team kill costs 3300
StartMoney=800
MaxMoney=16000
WinReward=3250
BombWinReward=3500
LossBonusBase=1400
LossBonusIncrement=500
LossBonusMax=3400
LosingTeamPlantBonus=800
PlantReward=300
DefuseReward=300
TeamKillPenalty=3300
; The equipment's prices (CS 1.6); the weapons' are in their sections (Price)
VestPrice=650
VestHelmetPrice=1000
HelmetPrice=350
DefuserPrice=200
; The teams' buy plans (the round's start): a team short of the full buy (its rifle and kevlar with a helmet for half
; of its players) saves, but forces the buy after this many losses in a row (also after a win and in a half's last round)
ForceBuyLossStreak=2
; The radio (CS 1.6): a message every 1.5 s at most, 60 a round
RadioCooldown=1.5
MaxRadioMessagesPerRound=60
; The bots' names, in the order the bots join (CS 1.6's BotProfile names: a bot keeps its name when the halftime moves it
; to the other side, so the names say nothing of a team; the bot's random stream comes from its index, not its name)
+BotNames=Albert
+BotNames=Allen
+BotNames=Bert
+BotNames=Bob
+BotNames=Cecil
+BotNames=Clarence
+BotNames=Elliot
+BotNames=Elmer
+BotNames=Ernie
+BotNames=Eugene
+BotNames=Fergus
+BotNames=Ferris
+BotNames=Frank
+BotNames=Frasier
+BotNames=Fred
+BotNames=George
+BotNames=Graham
+BotNames=Harvey
+BotNames=Irwin
+BotNames=Lester
; The seed of the round stream (the bomb's carrier); ?seed=N in the URL overrides it
RandomSeed=1

[/Script/ShooterGame.ShooterBomb]
; The C4: 40 s from the plant, 3 s to plant, 10 s to defuse (5 with a kit), 500 damage within 44.5 m through walls
; (CS 1.6: 1750 units at 2.54 cm), armor taking its share as with the HE grenade (ArmorRatio 1)
BombTimer=40.0
PlantDuration=3.0
DefuseDuration=10.0
DefuseKitDuration=5.0
ExplosionDamage=500.0
ExplosionRadius=4445.0
ArmorRatio=1.0
MeshName=/Game/Weapons/SM_C4.SM_C4
BeepSoundName=/Game/Sounds/S_Bomb_Beep.S_Bomb_Beep
PlantSoundName=/Game/Sounds/S_Bomb_Plant.S_Bomb_Plant
DefuseSoundName=/Game/Sounds/S_Bomb_Defuse.S_Bomb_Defuse
ExplodeSoundName=/Game/Sounds/S_Explosion.S_Explosion

[/Script/ShooterGame.ShooterAIController]
; The bots' skill (CS bot_difficulty): 0.5 easy, 1 normal, 2 hard; it scales the reaction and the aim error down
Difficulty=1.0
; Seconds from an enemy coming into sight to the first shot
ReactionTime=0.35
; The aim's error on a new target (degrees), how fast it settles (seconds for 1/e) and its floor
AimError=5.0
AimErrorDecayTime=0.8
MinAimError=0.4
; Turn rate (degrees a second)
AimTurnRate=360.0
; How far a bot sees an enemy (cm): de_leon's lanes are 35 to 45 m long, and at 60 m the duels from the terrorists'
; plaza into the sites decided the rounds (ps2-polish P3)
SightRadius=3500.0
; The part of each recoil kick a bot pulls back down while it sprays (0: the kick climbs, 1: a laser), scaled by
; Difficulty; the kick left rides on the bot's aim as on a player's (CS's bots spray with the recoil too)
RecoilCompensation=0.5
; Automatic fire in bursts: shots, then a pause (seconds)
BurstShots=4
BurstPause=0.35
; Seconds an enemy out of sight is remembered
EnemyMemory=1.5
; The chance to buy the AWP when affordable with armor
AwpChance=0.2
; How near a goal counts as reached (cm)
GoalReachedDistance=200.0
; How near the bomb carrier an escorting terrorist stays (cm)
EscortDistance=350.0
; Seconds a CT holds its site without contact before rotating to the next one
RotateTime=25.0
; Living players over the enemy's a team needs to hunt them while no bomb is planted (0: never)
HuntAdvantage=2
; A terrorist hunts with this few seconds of the round left and no bomb planted (0: never)
HuntTimeLeft=30.0
; No enemy in sight (ps2-polish P3): seconds at a site's lookout, and watching each of its directions (the main way in
; twice as long, between each of the others); the turn to look (degrees a second); how near its site the carrier must
; be for the other terrorists to take the site's lookouts (cm); a teammate's enemy this near a site is at it (cm), and
; the chance a counter-terrorist holding the other site rotates there
LookoutMinTime=3.0
LookoutMaxTime=7.0
WatchMinTime=1.0
WatchMaxTime=2.5
LookTurnRate=240.0
SupportDistance=1500.0
SiteReportRadius=1500.0
RotateOnReportChance=1.0
; How far a bot without a loaded primary goes for one on the floor (cm); out of ammunition, twice as far for any
; weapon with ammunition (its spent one is dropped for it)
PickupSearchDistance=1500.0
; The planted bomb (ps2-polish P3b): the terrorists hold from the lookouts within PostPlantHoldRadius of it (cm) and
; follow nothing farther; the counter-terrorists gather RetakeStagingDistance from it toward their spawn (cm) until a
; teammate is within RetakeGroupRadius or RetakeWaitTime (s) passes, defuse once no enemy was seen for SiteClearTime
; (s) or the time runs short, and give the retake up (saving themselves) when the terrorists alive outnumber them by
; RetakeGiveUpAdvantage or the time left cannot cover the walk and the defuse
PostPlantHoldRadius=1000.0
RetakeStagingDistance=1500.0
RetakeGroupRadius=500.0
RetakeWaitTime=8.0
SiteClearTime=2.5
RetakeGiveUpAdvantage=2
; Fighting (CS's bots): strafe left and right 0.4 to 1 s each way at the walk key's speed; with a rifle crouch and stop
; at 15 m or farther (the AWP always stands)
StrafeMinTime=0.4
StrafeMaxTime=1.0
bStrafeWalking=True
CrouchFireDistance=1500.0
; The grenades bought with the money left after the rest, in order (CS's limits: two flashbangs, one HE, one smoke;
; '.' adds the second flashbang, '+' would skip a value already there)
+GrenadeBuyOrder=flashbang
+GrenadeBuyOrder=hegrenade
+GrenadeBuyOrder=smokegrenade
.GrenadeBuyOrder=flashbang
; The throws: the chance a round of the entry's grenade (a T nearing the site, a CT the planted bomb, within 18 m)
; and of a grenade at an enemy's spot; the spots from 9 m (the HE's radius) to 22 m; up to 1 m off; 4 s between throws
GrenadeChance=0.4
EntryGrenadeDistance=1800.0
MinGrenadeDistance=900.0
MaxGrenadeDistance=2200.0
GrenadeThrowError=100.0
GrenadeCooldown=4.0
; Blinded by a flashbang: fire at random within 25 degrees of where the enemy was, a new point every 0.25 to 0.6 s,
; firing at 60 % of them
BlindFireError=25.0
BlindFireMinTime=0.25
BlindFireMaxTime=0.6
BlindFireChance=0.6
; The radio: a message a teammate sent in the last 3 s is not repeated; a teammate's spotted enemy within 30 m is
; worth a look; below 40 health "Need backup."
RadioRepeatTime=3.0
RadioReportRange=3000.0
NeedBackupHealth=40.0

[/Script/ShooterGame.ShooterCharacterMovement]
; The walk key's fraction of the running speed (CS: 52 %); the rest of the movement is in ShooterCharacterMovement.h
WalkSpeedModifier=0.52

[/Script/ShooterGame.ShooterCharacter]
; How fast the view follows a crouch (FMath::FInterpTo speed)
EyeHeightInterpSpeed=14.0
; The animated pawn (Docs/PLANS/ps2-shipping.md N25, N27; made in Blender: SourceArt/Characters): the teams' skinned
; bodies the others see and first-person arms, the body's locomotion (by speed in cm/s and direction in degrees),
; standing and crouched, its jump, the default stance (a weapon's AimOffsetName replaces it), the deaths, the bomb's
; montages and the footsteps. The weapon sits on the Weapon_R socket of the arms and the body (WeaponSocketName), and
; the upper body starts at UpperBodyBranchBone (spine_01).
CTBodyMeshName=/Game/Characters/SK_Body_CT.SK_Body_CT
TBodyMeshName=/Game/Characters/SK_Body_T.SK_Body_T
CTArmsMeshName=/Game/Characters/Arms/SK_Arms_CT.SK_Arms_CT
TArmsMeshName=/Game/Characters/Arms/SK_Arms_T.SK_Arms_T
LocomotionBlendSpaceName=/Game/Characters/Animations/BS_Locomotion.BS_Locomotion
CrouchBlendSpaceName=/Game/Characters/Animations/BS_Crouch.BS_Crouch
AimOffsetName=/Game/Characters/Animations/AO_Rifle.AO_Rifle
JumpStartAnimName=/Game/Characters/Animations/A_Jump_Start.A_Jump_Start
JumpLoopAnimName=/Game/Characters/Animations/A_Jump_Loop.A_Jump_Loop
JumpLandAnimName=/Game/Characters/Animations/A_Jump_Land.A_Jump_Land
DeathAnimBackName=/Game/Characters/Animations/AM_Death_Back.AM_Death_Back
DeathAnimFrontName=/Game/Characters/Animations/AM_Death_Front.AM_Death_Front
PlantAnim1PName=/Game/Characters/Arms/Animations/AM_C4_Plant.AM_C4_Plant
PlantAnim3PName=/Game/Characters/Animations/AM_Plant_C4.AM_Plant_C4
DefuseAnim3PName=/Game/Characters/Animations/AM_Defuse.AM_Defuse
; The footsteps by the floor's surface (its physical material's; N30f), the left foot's then the right's (CS's pl_step
; on concrete and the default, pl_dirt, pl_metal, pl_tile; a wooden knock), and a ladder's every 0.35 s (CS's
; pl_ladder)
FootstepSounds=(Default=("/Game/Sounds/S_Step_Concrete_L.S_Step_Concrete_L","/Game/Sounds/S_Step_Concrete_R.S_Step_Concrete_R"),Concrete=("/Game/Sounds/S_Step_Concrete_L.S_Step_Concrete_L","/Game/Sounds/S_Step_Concrete_R.S_Step_Concrete_R"),Dirt=("/Game/Sounds/S_Step_Dirt_L.S_Step_Dirt_L","/Game/Sounds/S_Step_Dirt_R.S_Step_Dirt_R"),Metal=("/Game/Sounds/S_Step_Metal_L.S_Step_Metal_L","/Game/Sounds/S_Step_Metal_R.S_Step_Metal_R"),Wood=("/Game/Sounds/S_Step_Wood_L.S_Step_Wood_L","/Game/Sounds/S_Step_Wood_R.S_Step_Wood_R"),Tile=("/Game/Sounds/S_Step_Tile_L.S_Step_Tile_L","/Game/Sounds/S_Step_Tile_R.S_Step_Tile_R"))
+LadderStepSoundNames=/Game/Sounds/S_Step_Ladder_1.S_Step_Ladder_1
+LadderStepSoundNames=/Game/Sounds/S_Step_Ladder_2.S_Step_Ladder_2
LadderStepInterval=0.35
WeaponSocketName=Weapon_R
; CS: 100 health, up to 100 armor; the hit groups on the capsule: the head its top 28 cm, below it the legs up to 59 %
; of the body, the stomach to 75 %, the chest above (an arm farther than 60 % of the radius to the side); the stomach
; takes 1.25 times the damage, the legs 0.75 (and no armor)
MaxHealth=100.0
MaxArmor=100.0
HeadHeight=28.0
LegsFraction=0.59
StomachFraction=0.75
ArmFraction=0.6
StomachDamageMultiplier=1.25
LegDamageMultiplier=0.75
; Every player spawns with the knife, and the team's pistol with two clips more (CS: the USP 12/24 for the CT, the
; Glock 20/40 for the T)
+DefaultWeapons=knife
+DefaultWeaponsCT=usp
+DefaultWeaponsT=glock
DefaultWeaponClips=2
; A corpse stays until the round restarts
CorpseLifeSpan=0.0
; The right stick at full tilt: degrees a second of yaw and pitch (a console shooter's quick turn)
BaseTurnRate=150.0
BaseLookUpRate=100.0
; How far the bots hear a footstep (AActor::MakeNoise's loudness, a shot's is 1): 12.5 m through walls, 25 m in sight
FootstepNoiseLoudness=0.5

; The weapons (AShooterWeapon and its classes; the constructors hold CS 1.6's values, these sections their looks and
; animations). The models are made by SourceArt/Weapons/make_weapons.py, the arms' and the body's clips by
; SourceArt/Characters (N27), the sounds by SourceArt/Sounds/make_sounds.py (CC0). Each weapon has its world model
; (MeshName) and first-person model (FirstPersonMeshName), the arms' idle (ArmsIdleName), the body's stance
; (AimOffsetName) and the fire, reload and draw montages of the arms (1P) and the body (3P); the pistols share the
; pistol's clips, the MP5 and the rifles the rifle's. A draw lasts its montage (1 s; the AWP 1.27 s, the HE 0.5 s), a
; reload CS's ReloadDuration, its montage played to fit (the Glock and the Deagle 2.2 s, the USP 2.7 s, the MP5
; 2.63 s, the AK-47 2.5 s, the M4A1 3.05 s, the AWP 3.7 s). The FirstPersonOffset places the model on a pawn without
; arms.

; Every hitscan weapon: the sound of a bullet's impact by the surface it enters (its physical material's; N30f): CS's
; debris and ricochets, a character's flesh; on a character's armor and helmet CS's bhit_kevlar and bhit_helmet. The
; surfaces' penetration is CS's (AShooterWeapon_Instant::GetSurfacePenetration).
[/Script/ShooterGame.ShooterWeapon_Instant]
