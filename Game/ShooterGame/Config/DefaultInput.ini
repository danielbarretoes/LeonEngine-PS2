; DefaultInput.ini - ShooterGame's input (UE: <Project>/Config/DefaultInput.ini), over Engine/Config/BaseInput.ini,
; which already maps MoveForward (W / S), MoveRight (D / A), Turn / LookUp (the mouse) and Jump (Space).

[/Script/Engine.InputSettings]
; The mouse: 0.07 degrees per pixel (about CS's sensitivity 3 at m_yaw 0.022) instead of the fly camera's 0.3.
; UPlayerInput::SetMouseSensitivity (the SetMouseSensitivity console command) changes it for a player.
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.07))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.07))
; No flying: E / Q are not the default pawn's up / down here (E is CS's use key)
-AxisMappings=(AxisName="MoveUp",Key=E,Scale=1.0)
-AxisMappings=(AxisName="MoveUp",Key=Q,Scale=-1.0)
; Held to crouch (CS: Ctrl; C as well) and to walk (CS: Shift)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Walk",Key=LeftShift)
; The weapons (AShooterCharacter): fire, the sniper's zoom, reload, the slots (CS: 1 primary, 2 pistol, 4 grenade)
; and dropping the weapon in hand
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Targeting",Key=RightMouseButton)
+ActionMappings=(ActionName="Reload",Key=R)
+ActionMappings=(ActionName="PrimaryWeapon",Key=One)
+ActionMappings=(ActionName="SecondaryWeapon",Key=Two)
+ActionMappings=(ActionName="Grenade",Key=Four)
+ActionMappings=(ActionName="DropWeapon",Key=G)
; The scoreboard (held) and the game menu (placeholders until P19)
+ActionMappings=(ActionName="Scoreboard",Key=Tab)
+ActionMappings=(ActionName="Menu",Key=Escape)
