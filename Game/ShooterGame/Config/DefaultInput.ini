; DefaultInput.ini - ShooterGame's input (UE: <Project>/Config/DefaultInput.ini), over Engine/Config/BaseInput.ini,
; which already maps MoveForward (W / S), MoveRight (D / A), Turn / LookUp (the mouse) and Jump (Space).

[/Script/Engine.InputSettings]
; The mouse: 0.07 degrees per pixel (about CS's sensitivity 3 at m_yaw 0.022) instead of the engine's 0.3.
; UPlayerInput::SetMouseSensitivity (the SetMouseSensitivity console command) changes it for a player.
-AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
-AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.07))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.07))
; No flying: E / Q are not the default pawn's up / down here (E is CS's use key)
-AxisMappings=(AxisName="MoveUp",Key=E,Scale=1.0)
-AxisMappings=(AxisName="MoveUp",Key=Q,Scale=-1.0)
; Crouch (CS: Ctrl; a press toggles, or held with the player's SetToggleCrouch 0) and walk (CS: Shift, held)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Walk",Key=LeftShift)
; The radio's three menus (CS 1.6: Z radio1, X radio2, C radio3); the number keys send a message while one is open
+ActionMappings=(ActionName="Radio1",Key=Z)
+ActionMappings=(ActionName="Radio2",Key=X)
+ActionMappings=(ActionName="Radio3",Key=C)
; The weapons (AShooterCharacter): fire, the secondary attack (the AWP's zoom, a silencer, the Glock's burst, the
; knife's stab), reload, the slots (CS: 1 primary, 2 pistol, 3 knife, 4 grenade, 5 the bomb) and dropping the weapon
; in hand (or the bomb, drawn)
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Targeting",Key=RightMouseButton)
+ActionMappings=(ActionName="Reload",Key=R)
+ActionMappings=(ActionName="PrimaryWeapon",Key=One)
+ActionMappings=(ActionName="SecondaryWeapon",Key=Two)
+ActionMappings=(ActionName="Knife",Key=Three)
+ActionMappings=(ActionName="Grenade",Key=Four)
+ActionMappings=(ActionName="Bomb",Key=Five)
+ActionMappings=(ActionName="DropWeapon",Key=G)
; The bomb: held to plant (a carrier in a site) or to defuse (CS: E, use)
+ActionMappings=(ActionName="Use",Key=E)
; The buy menu (B) and its items on the number keys while it is open (the slots' keys otherwise: the menu's own input
; component takes them only while it is open)
+ActionMappings=(ActionName="BuyMenu",Key=B)
; A box of the primary's and of the pistol's ammunition, in the buy zone (CS: buyammo1 on ",", buyammo2 on ".")
+ActionMappings=(ActionName="BuyPrimaryAmmo",Key=Comma)
+ActionMappings=(ActionName="BuySecondaryAmmo",Key=Period)
+ActionMappings=(ActionName="MenuItem1",Key=One)
+ActionMappings=(ActionName="MenuItem2",Key=Two)
+ActionMappings=(ActionName="MenuItem3",Key=Three)
+ActionMappings=(ActionName="MenuItem4",Key=Four)
+ActionMappings=(ActionName="MenuItem5",Key=Five)
+ActionMappings=(ActionName="MenuItem6",Key=Six)
+ActionMappings=(ActionName="MenuItem7",Key=Seven)
+ActionMappings=(ActionName="MenuItem8",Key=Eight)
+ActionMappings=(ActionName="MenuItem9",Key=Nine)
; The scoreboard (held) and the menu (Esc closes the buy menu)
+ActionMappings=(ActionName="Scoreboard",Key=Tab)
+ActionMappings=(ActionName="Menu",Key=Escape)

; The PS2's DualShock (the gamepad keys FPS2InputInterface reports; its sticks come with their dead zone applied):
; the left stick moves, the right stick turns at AShooterCharacter's BaseTurnRate / BaseLookUpRate, the triggers fire
; and zoom, the face buttons jump (Cross), crouch (Circle), reload (Square) and use (Triangle), the shoulders take the
; primary (R1) and the pistol (L1), the D-pad the knife (up), the grenade (left), the bomb (down) and drops the weapon
; (right), L3 walks, Select holds the scoreboard and Start opens the buy menu.
+AxisMappings=(AxisName="MoveForward",Key=Gamepad_LeftY,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=Gamepad_LeftX,Scale=1.0)
+AxisMappings=(AxisName="TurnRate",Key=Gamepad_RightX,Scale=1.0)
+AxisMappings=(AxisName="LookUpRate",Key=Gamepad_RightY,Scale=1.0)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Crouch",Key=Gamepad_FaceButton_Right)
+ActionMappings=(ActionName="Reload",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="Use",Key=Gamepad_FaceButton_Top)
+ActionMappings=(ActionName="Fire",Key=Gamepad_RightTrigger)
+ActionMappings=(ActionName="Targeting",Key=Gamepad_LeftTrigger)
+ActionMappings=(ActionName="PrimaryWeapon",Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="SecondaryWeapon",Key=Gamepad_LeftShoulder)
+ActionMappings=(ActionName="Knife",Key=Gamepad_DPad_Up)
+ActionMappings=(ActionName="Grenade",Key=Gamepad_DPad_Left)
+ActionMappings=(ActionName="Bomb",Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="DropWeapon",Key=Gamepad_DPad_Right)
+ActionMappings=(ActionName="Walk",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="Scoreboard",Key=Gamepad_Special_Left)
+ActionMappings=(ActionName="BuyMenu",Key=Gamepad_Special_Right)
; The buy menu with the pad (its own input component while it is open: these keys are not the pawn's then): the
; D-pad's up and down highlight an item, Cross buys it, Circle closes the menu
+ActionMappings=(ActionName="MenuUp",Key=Gamepad_DPad_Up)
+ActionMappings=(ActionName="MenuDown",Key=Gamepad_DPad_Down)
+ActionMappings=(ActionName="MenuSelect",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Menu",Key=Gamepad_FaceButton_Right)
