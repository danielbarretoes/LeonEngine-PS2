name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ps2:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev@sha256:79c24d3762f5cfeee0beabeacc94480fe580d379d3e48a0bfbac681a8895daf6
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake, Ninja and the host g++ (LeonHeaderTool)
        run: apk add --no-cache cmake ninja make g++ musl-dev
      - name: Build ThirdPerson (PS2) with LeonBuildTool
        run: |
          sh Engine/Build/BatchFiles/Linux/Build.sh ThirdPerson PS2 Development \
            "-Project=$PWD/Game/ThirdPerson/ThirdPerson.lproj"
      - name: Build BlankProgram (PS2)
        run: sh Engine/Build/BatchFiles/Linux/Build.sh BlankProgram PS2 Development
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ThirdPerson-PS2-elf
          path: Game/ThirdPerson/Binaries/PS2/ThirdPerson.elf

  # Formatting is checked locally with Engine\Build\BatchFiles\Lint.bat (clang-format output is
  # version-specific; the runner's LLVM may differ from Visual Studio's).
  win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Banned APIs (G4)
        shell: pwsh
        run: ./Engine/Build/BatchFiles/CheckBannedApis.ps1
      - name: Setup (pinned third-party downloads)
        shell: cmd
        run: call Setup.bat
      - name: Build + run LeonAutomationTests
        shell: cmd
        run: call Engine\Build\BatchFiles\RunTests.bat
      - name: Build LeonGame and LeonCook
        shell: cmd
        run: |
          call Engine\Build\BatchFiles\Build.bat LeonGame Win64 Development || exit /b 1
          call Engine\Build\BatchFiles\Build.bat LeonCook Win64 Development
      # ShooterGame boots headless on de_leon, bot_fill makes five a side, and it exits 0 reporting the ten pawns.
      - name: ShooterGame smoke (G6)
        shell: cmd
        run: call Engine\Build\BatchFiles\SmokeTest.bat
      # Ten bots play ten rounds of de_leon headless and unpaced (-benchmark), seed 7; the game checks the match's
      # invariants every frame and exits 1 when one breaks.
      - name: ShooterGame bot match (P21)
        shell: cmd
        run: call Engine\Build\BatchFiles\BotMatch.bat 10 7
      - name: Reproducible reimport (G5)
        shell: cmd
        run: call Engine\Build\BatchFiles\CheckReimport.bat Game\ThirdPerson\ThirdPerson.lproj Game\ShooterGame\ShooterGame.lproj
      # A content-only project cooked, staged into a pak and run headless from the staged folder (Development: it
      # reuses the build above; the Shipping staged build is checked locally, Docs/BUILD.md "Staging").
      - name: Staged build smoke (BuildCookRun)
        shell: cmd
        run: |
          if not exist Engine\Saved\StagingTest mkdir Engine\Saved\StagingTest
          > Engine\Saved\StagingTest\StagingTest.lproj echo { "FileVersion": 3, "EngineAssociation": "", "Modules": [] }
          call Engine\Build\BatchFiles\BuildCookRun.bat -project=Engine\Saved\StagingTest\StagingTest.lproj -platform=Win64 -configuration=Development -build -cook -stage -pak -run "-addcmdline=-nullrhi -ExitAfterFrames=60"
      # The code project cooked (de_leon, the team bodies), staged into a pak and run from the staged folder with the
      # G6 command line.
      - name: ShooterGame staged build smoke (BuildCookRun)
        shell: cmd
        run: call Engine\Build\BatchFiles\BuildCookRun.bat -project=Game\ShooterGame\ShooterGame.lproj -platform=Win64 -configuration=Development -build -cook -stage -pak -run "-addcmdline=-nullrhi -ExecCmds=bot_fill -ExitAfterFrames=120"

  # The staged Shipping game (BuildCookRun; the Shipping build tree is separate from Development's, so it runs as a job
  # of its own, in parallel) plays a short bot match from its pak. Shipping logs nothing, so the game's exit code
  # carries the match's invariants.
  win64-shipping:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup (pinned third-party downloads)
        shell: cmd
        run: call Setup.bat
      - name: ShooterGame staged Shipping bot match (BuildCookRun)
        shell: cmd
        run: call Engine\Build\BatchFiles\BuildCookRun.bat -project=Game\ShooterGame\ShooterGame.lproj -platform=Win64 -configuration=Shipping -build -cook -stage -pak -run "-addcmdline=-nullrhi -benchmark -botmatch -rounds=3 -seed=7"
