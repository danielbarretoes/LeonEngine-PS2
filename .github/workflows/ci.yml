name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ps2:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev@sha256:79c24d3762f5cfeee0beabeacc94480fe580d379d3e48a0bfbac681a8895daf6
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake + Ninja
        run: apk add --no-cache cmake ninja make
      - name: Build ThirdPerson (PS2) with LeonBuildTool
        run: |
          sh Engine/Build/BatchFiles/Linux/Build.sh ThirdPerson PS2 Development \
            "-Project=$PWD/Game/ThirdPerson/ThirdPerson.lproj"
      - name: Build BlankProgram (PS2)
        run: sh Engine/Build/BatchFiles/Linux/Build.sh BlankProgram PS2 Development
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ThirdPerson-PS2-elf
          path: Game/ThirdPerson/Binaries/PS2/ThirdPerson.elf

  # Formatting is checked locally with Engine\Build\BatchFiles\Lint.bat (clang-format output is
  # version-specific; the runner's LLVM may differ from Visual Studio's).
  win64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup (pinned third-party downloads)
        shell: cmd
        run: call Setup.bat
      - name: Build + run LeonAutomationTests
        shell: cmd
        run: call Engine\Build\BatchFiles\RunTests.bat
      - name: Build LeonGame and LeonCook
        shell: cmd
        run: |
          call Engine\Build\BatchFiles\Build.bat LeonGame Win64 Development || exit /b 1
          call Engine\Build\BatchFiles\Build.bat LeonCook Win64 Development
