name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ps2-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Ps2Hello ELF (ps2dev container)
        run: |
          chmod +x Scripts/build-ps2.sh Scripts/build-ps2-docker.sh
          Scripts/build-ps2-docker.sh hello
      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: leon-Ps2Hello-elf
          path: Samples/Ps2Hello/build-ps2/leon-Ps2Hello.elf

  # Host Editor build is validated locally (Scripts/build.bat). Full MSVC + FetchContent
  # on GHA is optional; enable when a self-hosted or windows-latest matrix is wired.
