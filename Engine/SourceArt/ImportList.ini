; Engine/SourceArt/ImportList.ini - the source files of the engine's imported assets (UE keeps source art outside
; Content). Import them all:
;   LeonCook -run=ImportAssets -importlist=Engine/SourceArt/ImportList.ini
; Each imported asset records its source in its AssetImportData, so they come back from their sources with
;   LeonCook -run=ImportAssets -reimport -all
; which must leave Engine/Content unchanged (gate G5, Engine/Build/BatchFiles/CheckReimport.bat).
;
; One section per asset: Source (relative to this file), Dest (the long package path of its folder; a map's own
; package), optional Name (default: the file name with its class prefix) and Type (Texture, TextureCube, StaticMesh,
; SkeletalMesh, Animation, Sound, Map, Font; default: by extension); any other key is an import setting of the factory
; (ColorSpaceMode=Linear, ...).
;
; The engine's other assets have no source file: the materials (M_*) are authored as assets, and DefaultTexture and
; the BasicShapes were saved once from their procedural generators.

[T_Default_D]
Source=EngineMaterials/T_Default_D.png
Dest=/Engine/EngineMaterials

; The engine's fonts (UEngine's TinyFont, SmallFont, MediumFont, LargeFont): DejaVu Sans Condensed (EngineFonts/, its
; license in EngineFonts/LICENSE.txt, Engine/SourceArt/LICENSES.md) rasterized by UTrueTypeFontFactory at 10, 14, 20
; and 32 pixels into PSMT4 pages, ASCII and Latin-1.
[DejaVuSansCondensed10]
Source=EngineFonts/DejaVuSansCondensed.ttf
Dest=/Engine/EngineFonts
Name=DejaVuSansCondensed10
Type=Font
Height=10

[DejaVuSansCondensed14]
Source=EngineFonts/DejaVuSansCondensed.ttf
Dest=/Engine/EngineFonts
Name=DejaVuSansCondensed14
Type=Font
Height=14

[DejaVuSansCondensed20]
Source=EngineFonts/DejaVuSansCondensed.ttf
Dest=/Engine/EngineFonts
Name=DejaVuSansCondensed20
Type=Font
Height=20

[DejaVuSansCondensed32]
Source=EngineFonts/DejaVuSansCondensed.ttf
Dest=/Engine/EngineFonts
Name=DejaVuSansCondensed32
Type=Font
Height=32

; The axes map (Maps/MakeAxisTest.py writes the .glb): its meshes and materials go to /Engine/Maps/AxisTest/.
[AxisTest]
Source=Maps/AxisTest.glb
Dest=/Engine/Maps/AxisTest
Type=Map
