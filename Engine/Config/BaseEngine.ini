; BaseEngine.ini - engine defaults (UE: Engine/Config/BaseEngine.ini, bottom of the config hierarchy).
; Loaded into GConfig as GEngineIni (Misc/ConfigCacheIni.h). Sections marked "not read yet" document defaults that
; are still hard-coded in C++.

[/Script/Engine.Engine]
; UEngine / UGameEngine (Engine/Source/Runtime/Engine/Classes/Engine/Engine.h, GameEngine.h). GameEngine is the class
; FEngineLoop::Init creates GEngine from (plan decision D18); the rest are UEngine's config members.
GameEngine=/Script/Engine.GameEngine
GameViewportClientClassName=/Script/Engine.GameViewportClient
LocalPlayerClassName=/Script/Engine.LocalPlayer
bShowStatsByDefault=False
; The default assets (UE: DefaultMaterialName, DefaultTextureName, ...): UMaterial::GetDefaultMaterial and
; UEngine::InitializeObjectReferences load them from their packages in Engine/Content.
DefaultMaterialName=/Engine/EngineMaterials/M_Default.M_Default
DefaultTextureName=/Engine/EngineResources/DefaultTexture.DefaultTexture
; The UI cues FAudioDevice::PlayUiSound plays (Leon): a USoundWave object path each
; (UIClickSoundName=/Game/Audio/S_UI_Click.S_UI_Click). Empty keeps the cue's procedural tone; the engine ships no UI
; sounds (Docs/ASSET_FORMATS.md, "UI sounds").
UIClickSoundName=
UIConfirmSoundName=
UIBackSoundName=
UIErrorSoundName=

[/Script/Engine.GarbageCollectionSettings]
; The UObject array's capacity (UE: gc.MaxObjectsInGame): the PS2's (FPS2PlatformProperties::MaxObjectsInGame) on every
; platform, so the PC runs out where the console does; a platform's own array is the ceiling, and -NoMemoryLimit
; lifts it (tools).
gc.MaxObjectsInGame=8192
; An incremental collection starts every this many seconds of game (Leon; UE's full collections: 61.1) and visits
; gc.IncrementalObjectsPerStep objects a world step (about 0.5 ms of the EE), until it ends and purges. A level load
; collects fully at once, and a game can ask for a full collection (UEngine::ForceGarbageCollection).
gc.TimeBetweenPurgingPendingKillObjects=10.0
gc.IncrementalObjectsPerStep=100

[/Script/Engine.GameViewportClient]
; The desktop game window's size: twice the GS frame (640x448), which the emulator shows scaled by a whole number
DefaultResolutionX=1280
DefaultResolutionY=896

[/Script/Engine.RendererSettings]
; The renderer (Renderer: FRendererSettings), with the PS2's values on every platform (Docs/PLANS/ps2-preview.md D1).
; The aspect ratio the 640 x 448 GS frame is shown at: the TV's 4:3 (its pixels are not square); 1.777778 for an
; anamorphic 16:9 game. The view's projection uses it, and the desktop presents the frame with it.
DisplayAspectRatio=1.333333
; The fields a frame is shown for at least (UE: rhi.SyncInterval): 2 is the PS2's steady 30 fps on NTSC (59.94 fields
; a second) and 25 on PAL (50) (Docs/PLANS/ps2-engine.md D6), 1 is 60 or 50. The PS2 counts the fields with its vertical
; blank interrupt; the desktop keeps NTSC's pace; -benchmark does not wait.
SyncInterval=2
; The KB of texels and CLUTs the GS texture cache uploads in a frame at most (Docs/PLANS/ps2-shipping.md N13): a
; texture over it draws with its smallest mip or a flat colour and uploads in the next frames. 0: no limit.
TextureUploadBudgetKB=128
; Scales the distance the static meshes' LODs are chosen by (Docs/PLANS/ps2-shipping.md N15; UE:
; r.StaticMeshLODDistanceScale): 2 draws each LOD from half as far (fewer triangles), 0.5 from twice as far.
StaticMeshLODDistanceScale=1.0

[/Script/Engine.AnimationSettings]
; The error bounds of the animation keys' reduction (AnimationCore: FAnimCompressionSettings; UE: UAnimationSettings),
; applied when a clip is imported (Docs/ASSET_FORMATS.md, animation keys; Docs/PLANS/ps2-shipping.md N21): a key is
; dropped when interpolating the kept keys stays within them at every 30 Hz frame of the source. Degrees, centimetres
; and scale units.
RotationErrorToleranceDegrees=0.1
TranslationErrorTolerance=0.05
ScaleErrorTolerance=0.001
; The skeletal meshes' update rate optimization (USkeletalMeshComponent::bEnableUpdateRateOptimizations,
; FAnimUpdateRateSettings; Docs/PLANS/ps2-shipping.md N25): the pose is evaluated every frame within
; UpdateRateDistanceStep cm of the nearest view, every second frame within twice that, and so on, at least every
; MaxUpdateRate frames.
UpdateRateDistanceStep=1500.0
MaxUpdateRate=4

[/Script/EngineSettings.GameMapsSettings]
; UGameMapsSettings (Engine/Source/Runtime/EngineSettings/Classes/GameMapsSettings.h).
; GameDefaultMap: the map LeonGame opens when its command line names none: the long package name of a .lmap map
; (/Engine/Maps/Template_Default = Engine/Content/Maps/Template_Default.lmap, UE's default template map).
; GlobalDefaultGameMode: the game mode when neither ?game= nor the level's world settings name one (plan decision D18).
GameDefaultMap=/Engine/Maps/Template_Default
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/Engine.GameModeBase
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.CollisionProfile]
; UCollisionProfile (Engine/Source/Runtime/Engine/Classes/Engine/CollisionProfile.h): the names of the game collision
; channels and the response every body starts with on them (the engine's channels block by default). A project names
; its own in DefaultEngine.ini, e.g.
;   +DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
; UE's named profiles (+Profiles=) are not read: components set their object type and responses in code.

[/Script/Engine.PhysicsSettings]
; UPhysicsSettings (Engine/Source/Runtime/Engine/Classes/PhysicsEngine/PhysicsSettings.h): the names of the game's
; surface types (EPhysicalSurface), which its physical materials (UPhysicalMaterial::SurfaceType) are. A project names
; its own in DefaultEngine.ini, e.g.
;   +PhysicalSurfaces=(Type=SurfaceType1,Name=Concrete)

[Core.Log]
; Run-time log verbosity per category (UE): LogTemp=Verbose, Global=Warning. -LogCmds="LogTemp Verbose" overrides.

