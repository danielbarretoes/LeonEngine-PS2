; BaseInput.ini - default input (UE: Engine/Config/BaseInput.ini), loaded as GInputIni. UInputSettings reads
; [/Script/Engine.InputSettings] and every player controller's UPlayerInput starts from these mappings; a project's
; Config/DefaultInput.ini adds (+) or removes (-) entries.

[/Script/Engine.InputSettings]
; The window keeps the mouse from the start (UE's default)
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bEnableFOVScaling=False
; The mouse axes read pixels (MouseY is positive upward); the sensitivity makes them degrees: 0.3 per pixel, the
; legacy fly camera's look speed
+AxisConfig=(AxisKeyName="MouseX",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
+AxisConfig=(AxisKeyName="MouseY",AxisProperties=(DeadZone=0.0,Exponent=1.0,Sensitivity=0.3))
; ADefaultPawn's axes: W / S and the arrows fly along the view, A / D strafe, E / Q world up / down, the mouse turns
+AxisMappings=(AxisName="MoveForward",Key=W,Scale=1.0)
+AxisMappings=(AxisName="MoveForward",Key=Up,Scale=1.0)
+AxisMappings=(AxisName="MoveForward",Key=S,Scale=-1.0)
+AxisMappings=(AxisName="MoveForward",Key=Down,Scale=-1.0)
+AxisMappings=(AxisName="MoveRight",Key=D,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=Right,Scale=1.0)
+AxisMappings=(AxisName="MoveRight",Key=A,Scale=-1.0)
+AxisMappings=(AxisName="MoveRight",Key=Left,Scale=-1.0)
+AxisMappings=(AxisName="MoveUp",Key=E,Scale=1.0)
+AxisMappings=(AxisName="MoveUp",Key=Q,Scale=-1.0)
+AxisMappings=(AxisName="Turn",Key=MouseX,Scale=1.0)
+AxisMappings=(AxisName="LookUp",Key=MouseY,Scale=1.0)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
