; BaseGame.ini - game defaults (UE: Engine/Config/BaseGame.ini). Loaded into GConfig as GGameIni, under the project's
; DefaultGame.ini (Misc/ConfigCacheIni.h).

[/Script/UnrealEd.ProjectPackagingSettings]
; What the cook takes besides the maps and what they reference (LeonEd's UCookCommandlet; UE's packaging settings).
; A project adds its own in DefaultGame.ini: +DirectoriesToAlwaysCook=(Path="/Game/UI"), +MapsToCook=(FilePath="/Game/Maps/X").
; The basic shapes are cooked whole: a game may load them by path (LoadObject), not only through a map's references.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

[/Script/LeonEd.CookSettings]
; The cook's hard budgets (FCookBudgets, Docs/PLANS/ps2-shipping.md N23): an asset or a map over one fails the cook.
; A project overrides them in DefaultGame.ini, a platform in <Platform>Game.ini; -<Key>=<value> on the cook's command
; line wins. Sizes in KB; 0 takes the platform's limit. Staged builds do not carry this section.
; Per map, with the common assets: the GS texture VRAM (0: the texture arena, 1856 KB), the EE RAM estimated from the
; cooked bytes (RuntimeBaseKB + bytes x RuntimeExpansionPercent / 100; 0: [Core.MemoryBudgets] Total of the platform's
; Engine config, none on Win64) and the SPU2 RAM (0: the 2028 KB audsrv leaves). RuntimeBaseKB is the part that does
; not grow with the cooked bytes, calibrated from MeasurePS2's GMalloc peaks (ps2-shipping N29: the frame's GS lists and
; DMA chains, the engine and the game's actors; de_leon's 1 433 cooked KB peaked at 4 947 KB with the EE drawing the
; characters, 5 069 with -novu1): 3 072 + 2 x 1 433 = 5 938 KB covers them.
MapVramKB=0
MapRamKB=0
RuntimeBaseKB=3072
RuntimeExpansionPercent=200
MapSoundRamKB=0
; Per asset: a mesh's triangles and bones, a texture's longer side once cooked (8 to 256) and its bits a texel (4:
; PSMT4 only, 8: PSMT4 or PSMT8).
MaxMeshTriangles=4096
MaxMeshBones=64
MaxTextureSize=256
MaxTextureBitsPerPixel=8
