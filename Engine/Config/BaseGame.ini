; BaseGame.ini - game defaults (UE: Engine/Config/BaseGame.ini). Loaded into GConfig as GGameIni, under the project's
; DefaultGame.ini (Misc/ConfigCacheIni.h).

[/Script/UnrealEd.ProjectPackagingSettings]
; What the cook takes besides the maps and what they reference (LeonEd's UCookCommandlet; UE's packaging settings).
; A project adds its own in DefaultGame.ini: +DirectoriesToAlwaysCook=(Path="/Game/UI"), +MapsToCook=(FilePath="/Game/Maps/X").
; The basic shapes are cooked whole: the engine loads them by path (BasicShape.cpp), not through a package reference.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
