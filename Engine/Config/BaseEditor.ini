; BaseEditor.ini - editor defaults (UE: Engine/Config/BaseEditor.ini, bottom of the Editor config hierarchy).
; Loaded into GConfig as GEditorIni on desktop (Misc/ConfigCacheIni.h): the settings of the editor module, LeonEd, that
; LeonCook's commandlets use. A project overrides them in <Project>/Config/DefaultEditor.ini.

[/Script/LeonEd.MapImportSettings]
; UMapImportSettings (Engine/Source/Editor/LeonEd/Classes/Factories/MapImportSettings.h): how -run=ImportAssets -type=Map
; (UGLTFMapFactory) turns the nodes of a glTF scene into actors. A node takes the rule with the longest Prefix its name
; starts with (compared without case):
;   Kind=Actor (the default)  an actor of ActorClass (a volume is the box of the node's mesh);
;   Kind=CollisionOnly        an invisible static mesh actor that collides;
;   Kind=ConvexCollision      a box of the collision of the mesh node its name names (UCX_<MeshNode>_<NN>);
;   Kind=Ignore               left out.
; Tags are added to the actor's Tags; with bSuffixAsTag the rest of the name is a tag too (BombSite_A: A), a player
; start's PlayerStartTag (PlayerStart_CT: CT). A mesh node no rule matches is an AStaticMeshActor; a light is a light.
; The engine's rules know no game (plan decision D15): a project adds its own, and the tags its maps must hold
; (RequiredTags: [<Class>:]<Tag>[+<Tag>...]), in Config/DefaultEditor.ini:
;   +NodeRules=(Prefix="BombSite",ActorClass=/Script/Engine.TriggerVolume,Tags=("BombSite"),bSuffixAsTag=True)
;   +RequiredTags=BombSite+A
;   +RequiredTags=PlayerStart:CT
+NodeRules=(Prefix="UCX_",Kind=ConvexCollision)
+NodeRules=(Prefix="COL_",Kind=CollisionOnly)
+NodeRules=(Prefix="Clip_",ActorClass=/Script/Engine.BlockingVolume)
+NodeRules=(Prefix="PlayerStart",ActorClass=/Script/Engine.PlayerStart,bSuffixAsTag=True)
+NodeRules=(Prefix="NavWaypoint",ActorClass=/Script/Engine.NavigationWaypoint)
