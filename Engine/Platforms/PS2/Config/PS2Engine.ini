; PS2Engine.ini - PS2 platform overrides (UE: Engine/Platforms/<Platform>/Config/<Platform>Engine.ini).
; Layered over BaseEngine.ini on the PS2 (and by tests asking for the PS2 hierarchy). The EE reads it through host:
; once RunPCSX2.ps1 stages Engine/Config and this folder next to the ELF.

[/Script/Engine.GameViewportClient]
; FEngineLoop main window / GS display (Launch/Private/LaunchEngineLoop.cpp, PS2Window.cpp)
DefaultResolutionX=640
DefaultResolutionY=448

[Core.MemoryBudgets]
; GMalloc's budgets on the EE, KB per memory tag (FLowLevelMemTracker, HAL/LowLevelMemTracker.h; Docs/PLANS/ps2-shipping.md
; N17): over WarningPercent of a budget logs a warning once, over the budget is a fatal error that names the tag. Total is
; the whole heap's (the stats' RAM line shows it); the EE has about 29 MB after the kernel, the ELF and the stack, less
; the 2 MB small-block arena's reservation. Measured peaks and the reasoning: Engine/Platforms/PS2/Documentation/Budgets.md.
WarningPercent=90
Total=24576
EngineMisc=2048
UObject=2048
LoadMapMisc=1024
Textures=6144
Meshes=4096
Animation=2048
Audio=4096
Physics=512
AI=256
SceneRender=1536
GameMisc=1536
Temporary=256
; RenderLists holds the frame's GS containers (the command lists, their vertex batches and skinned palettes, the two DMA
; chains), which grow with the triangles a frame draws (N27's characters, N14b).
RenderLists=4096

[/Script/Engine.Engine]
; The stats (UE: stat unit) from the start on the PS2, which has no console to type it: FPS, MS, RAM, VRAM, TRIS and
; OBJ at the top right; R3 toggles them (BaseInput.ini's DebugExecBindings).
bShowStatsByDefault=True
; A frame serializes the packages LoadPackageAsync read for at most this many milliseconds after the first (UE:
; s.AsyncLoadingTimeLimit; Docs/PLANS/ps2-shipping.md N24): a load during play costs frames, not one frame. 0 elsewhere.
AsyncLoadingTimeLimit=8
