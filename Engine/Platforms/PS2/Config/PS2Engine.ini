; PS2Engine.ini - PS2 platform overrides (UE: Engine/Platforms/<Platform>/Config/<Platform>Engine.ini).
; Layered over BaseEngine.ini on the PS2 (and by tests asking for the PS2 hierarchy). The EE reads it through host:
; once RunPCSX2.ps1 stages Engine/Config and this folder next to the ELF.

[/Script/Engine.GameViewportClient]
; FEngineLoop main window / GS display (Launch/Private/LaunchEngineLoop.cpp, PS2Window.cpp)
DefaultResolutionX=640
DefaultResolutionY=448

[/Script/PS2RHI.PS2Settings]
; EE RAM budget shown by the stats overlay (PS2PlatformMemory.cpp) and GS VRAM (PS2GSContext.cpp)
MainMemoryMB=32
VideoMemoryMB=4

[/Script/Engine.StatsOverlay]
; FStatsOverlay + FPS2StatsOverlay: both panels visible at start, Select cycles them
bShowStats=True
bShowGamepadWidget=True
PanelOpacity=0.5
