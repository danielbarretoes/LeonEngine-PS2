; PCSX2 settings for a measured run (MeasurePS2.ps1, Docs/PLANS/ps2-shipping.md N1).
; They override the user's PCSX2.ini in a private data folder (pcsx2-qt -datapath Game\<Project>\Saved\PCSX2), so a
; measurement does not depend on the settings the user plays with. Budgets.md labels each row with this file's hash:
; change a value and the numbers are a new series. {BIOS} and {DATA} are filled in by the script.
;
; The EE and VU timings are the console's (no cycle rate or skip, VU1 on the EE thread), the host filesystem serves
; the staged ELF's folder (host:), and the game's output goes to the log the script reads: the EE's printf (UE_LOG)
; reaches it through the IOP's tty:, so the IOP console is on too. The memory card in slot 1 is the data folder's own
; (Mcd001.ps2, made by PCSX2 the first time), so the game's settings (ps2-shipping N24) never touch the user's cards.

[UI]
SetupWizardIncomplete = false
ConfirmShutdown = false
StartFullscreen = false

[Folders]
Bios = {BIOS}
Logs = {DATA}\logs
Snapshots = {DATA}\snaps
Cache = {DATA}\cache
MemoryCards = {DATA}\memcards

[MemoryCards]
Slot1_Enable = true
Slot1_Filename = Mcd001.ps2
Slot2_Enable = false

[EmuCore]
EnableFastBoot = true
EnableFastBootFastForward = false
HostFs = true
EnableCheats = false
EnablePatches = false
EnablePerGameSettings = false

[EmuCore/Speedhacks]
EECycleRate = 0
EECycleSkip = 0
fastCDVD = false
vuThread = false
IntcStat = false
WaitLoop = false
vuFlagHack = true

[Framerate]
NominalScalar = 1

[Logging]
EnableEEConsole = true
EnableIOPConsole = true
